<script>
  // Turns a personal link like /under-the-tree/sarah into /under-the-tree/?p=sarah
  (function () {
    var seg = location.pathname.split('/').filter(Boolean);
    var onGitHub = /\.github\.io$/.test(location.hostname);
    var base = onGitHub && seg.length ? '/' + seg[0] + '/' : '/';
    var slug = (onGitHub ? seg[1] : seg[0]) || '';
    location.replace(base + (slug ? '?p=' + encodeURIComponent(slug) : '') + location.hash);
  })();
</script>
